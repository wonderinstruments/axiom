# Guide Configuration
# This configuration file is shared by both the guide client and the llama-server systemd service.
# Install to: /etc/guide/config.toml

[server]
# Server connection settings
host = "127.0.0.1"
port = 8234

[llama]
# Path to the llama-server binary
binary = "/home/edmundm/wonderinstruments/guide/third_party/go-llama.cpp/llama.cpp/build/bin/llama-server"

# Path to the GGUF model file (must be absolute path)
model = "/home/edmundm/wonderinstruments/guide/models/granite-4.0-h-tiny-Q6_K.gguf"

# Number of CPU threads to use (0 = auto-detect)
threads = 0

# Context size in tokens
ctx_size = 4096

# Temperature for sampling (0.0-2.0, default 0.7)
temperature = 0.7

# Number of GPU layers to offload (0 = CPU only)
n_gpu_layers = 0

# Batch size for prompt processing
batch = 512

# RoPE frequency base (0.0 = model default)
rope_freq_base = 0.0

# RoPE frequency scale (0.0 = model default)
rope_freq_scale = 0.0

# Lock model in RAM (prevents swapping)
mlock = false

# Enable verbose logging
verbose = false

# Additional command-line arguments to pass to llama-server
# Each entry should be a single argument (flag or value)
# Example: extra_args = ["--log-format", "json", "--metrics"]
extra_args = []
