# Axiom User Management
# This file controls system users.
# Edit this file and run `axiom-rebuild` to apply changes.

# =============================================================================
# CURATOR (Owner)
# =============================================================================
# The curator is the owner account with root permissions.
# Default password is "wonderinstruments" - change it here!
#
# To generate a password hash, run:
#   mkpasswd -m sha-512 "your-password"

curator {
  # displayName = "Curator"
  # hashedPassword = "$6$..."  # Uncomment and set to change from default
}

# =============================================================================
# USERS
# =============================================================================
# Additional users can be added here.

users {
  # User definitions
  # Each user needs: displayName, hasRootPermissions, hashedPassword
  #
  # Set hashedPassword = null to disable password login for the user.

  # Example:
  # alice {
  #   displayName = "Alice"
  #   hasRootPermissions = false
  #   hashedPassword = "$6$..."
  # }
}
