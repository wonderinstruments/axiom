# Axiom User Configuration
# This file controls user-customizable settings.
# Edit this file and run `axiom-rebuild` to apply changes.

# =============================================================================
# THEME
# =============================================================================
theme {
  # Available color schemes:
  #   rose-pine-moon, everforest, moonlight, spaceduck, woodland, sandcastle,
  #   selenized-dark, tokyo-night-storm, zenbones, eris, blueforest, aztec, zenburn
  colors = "selenized-dark"

  windows {
    gap.size = 0
    shadow.size = 1
  }
}

# =============================================================================
# TERMINAL
# =============================================================================
terminal {
  fontSize = 16
}

# =============================================================================
# NEOVIM
# =============================================================================
neovim {
  # Set to true if you want to configure neovim manually using a config file
  # instead of the declarative Nix configuration
  configureByConfigFile = false

  # Set to true once to reset ~/.config/nvim and re-seed from pristine on next rebuild
  # Remember to set back to false afterwards!
  resetConfigFileOnNextSwitch = false
}

# =============================================================================
# SCREENSAVER
# =============================================================================
screensaver {
  enable = true
  sleepAfterMinutes = 10

  # Command to run as screensaver. Options:
  #   "cmatrix -a -b"                           - Matrix rain effect (default)
  #   "python $HOME/scripts/fractal_saver.py"   - Fractal zoom
  #   "asciiquarium"                            - Aquarium
  #   "pipes-rs"                                - Pipes animation
  #   "cmatrix -C cyan"                         - Matrix with different color
  command = "cmatrix -a -b"
}

# =============================================================================
# FRACTAL WALLPAPER
# =============================================================================
fractal-wallpaper {
  enable = true
  width = 1920
  height = 1080
  fractalType = "mandelbrot"  # or "julia"
  iterations = 100            # Higher = more detail but slower
  searchDepth = 4             # Higher = more zoomed in (2-5 recommended)
  regenerateOnRebuild = false # Set to true to regenerate on every rebuild

  # For Julia set fractals, customize these:
  # juliaCReal = -0.7
  # juliaCImag = 0.27015
}

# =============================================================================
# SOUNDS
# =============================================================================
sounds {
  enable = true
}

# =============================================================================
# CLIPBOARD MONITOR
# =============================================================================
clipboardMonitor {
  enable = true
}

# =============================================================================
# DOCUMENTATION
# =============================================================================
docs {
  enable = true
}

# =============================================================================
# FILE COMMANDS
# =============================================================================
fileCommands {
  enable = true
}

# =============================================================================
# MUSIC LIBRARY (Musopen)
# =============================================================================
musopen {
  enable = false
}

# =============================================================================
# GITTYPE (Typing Practice)
# =============================================================================
gittype {
  enable = true
}

# =============================================================================
# KEYBINDINGS
# =============================================================================
# These use Mod4 (Super/Windows key) as the modifier.
# Format: "Mod4+key" or "Mod4+Shift+key"
keybindings {
  # Application shortcuts
  newTerminal = "Mod4+Return"
  tuiLauncher = "Mod4+Shift+Return"
  applicationLauncher = "Mod4+space"
  glowLauncher = "Mod4+Escape"
  windowSwitcher = "Mod4+Tab"

  # Window focus (vim-inspired)
  focusLeft = "Mod4+h"
  focusDown = "Mod4+j"
  focusUp = "Mod4+k"
  focusRight = "Mod4+l"

  # Move windows
  moveLeft = "Mod4+Shift+h"
  moveDown = "Mod4+Shift+j"
  moveUp = "Mod4+Shift+k"
  moveRight = "Mod4+Shift+l"

  # Splitting
  splitHorizontal = "Mod4+s"
  splitVertical = "Mod4+v"

  # Window actions
  closeWindow = "Mod4+q"
  toggleFullscreen = "Mod4+f"

  # Workspace navigation
  workspace1 = "Mod4+1"
  workspace2 = "Mod4+2"
  workspace3 = "Mod4+3"
  workspace4 = "Mod4+4"
  workspace5 = "Mod4+5"
  workspace6 = "Mod4+6"
  workspace7 = "Mod4+7"
  workspace8 = "Mod4+8"
  workspace9 = "Mod4+9"
  workspace10 = "Mod4+0"

  # Move to workspace
  moveToWorkspace1 = "Mod4+Shift+1"
  moveToWorkspace2 = "Mod4+Shift+2"
  moveToWorkspace3 = "Mod4+Shift+3"
  moveToWorkspace4 = "Mod4+Shift+4"
  moveToWorkspace5 = "Mod4+Shift+5"
  moveToWorkspace6 = "Mod4+Shift+6"
  moveToWorkspace7 = "Mod4+Shift+7"
  moveToWorkspace8 = "Mod4+Shift+8"
  moveToWorkspace9 = "Mod4+Shift+9"
  moveToWorkspace10 = "Mod4+Shift+0"
}
