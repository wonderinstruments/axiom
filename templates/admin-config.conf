# Axiom Admin Configuration
# This file controls administrator-level settings.
# Edit this file and run `axiom-rebuild` to apply changes.

# =============================================================================
# WEB BROWSERS
# =============================================================================
web {
  firefox.enable = false
  chromium.enable = false
  librewolf.enable = true
  mullvad-browser.enable = true
}

# =============================================================================
# GAMES
# =============================================================================
# Set enable = true for games you want to install
games {
  endless-sky.enable = false
  widelands.enable = false
  freeciv.enable = false
  the-powder-toy.enable = false
  zeroad.enable = false
  openttd.enable = false
  katomic.enable = false
  mindustry.enable = false
  luanti.enable = false
  pingus.enable = false
  tuxtype.enable = false
}

# =============================================================================
# APPLICATIONS
# =============================================================================
# These are optional applications that require explicit enabling
applications {
  xiphos.enable = false
  warp-terminal.enable = true
  spotify.enable = true
  obsidian.enable = true
  slack.enable = false
  discord.enable = false
}
