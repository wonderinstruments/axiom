# Axiom Admin Configuration
# This file controls administrator-level settings.
# Edit this file and run `axiom-rebuild` to apply changes.

# =============================================================================
# WEB BROWSERS
# =============================================================================
web {
  firefox.enable = true
  chromium.enable = true
}

# =============================================================================
# GAMES
# =============================================================================
# Set enable = true for games you want to install
games {
  endless-sky.enable = true
  widelands.enable = true
  freeciv.enable = true
  the-powder-toy.enable = true
  zeroad.enable = true
  openttd.enable = true
  katomic.enable = true
  mindustry.enable = true
  luanti.enable = true
  pingus.enable = true
  tuxtype.enable = true
}

# =============================================================================
# APPLICATIONS
# =============================================================================
# These are optional applications that require explicit enabling
applications {
  xiphos.enable = true
  warp-terminal.enable = true
  spotify.enable = true
  obsidian.enable = true
  slack.enable = true
  discord.enable = true
}
