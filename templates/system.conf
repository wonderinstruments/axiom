# Axiom System Configuration
# This file controls global system settings.
# Edit this file and run `axiom-rebuild` to apply changes.

# =============================================================================
# SYSTEM
# =============================================================================

system {
  # Device hostname (appears in terminal prompt, network, etc.)
  hostname = "axiom"

  # Timezone - see: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  # Examples: "America/New_York", "Europe/London", "Asia/Tokyo"
  timezone = "America/Los_Angeles"

  # Default locale
  locale = "en_US.UTF-8"
}
